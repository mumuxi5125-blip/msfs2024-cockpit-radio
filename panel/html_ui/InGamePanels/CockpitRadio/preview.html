<!DOCTYPE html>
<html>
	<head>
		<title>驾驶舱电台</title>
		<meta charset="utf-8"/>
		<link rel="stylesheet" href="/SCSS/common.css"/>
		<link rel="stylesheet" href="preview.css"/>
		<script type="text/javascript" src="/JS/coherent.js"></script>
		<script type="text/javascript" src="/JS/common.js"></script>
		<script type="text/javascript" src="/JS/dataStorage.js"></script>
		<script type="text/javascript" src="/JS/buttons.js"></script>
		<script type="text/javascript" src="/JS/Services/ToolBarPanels.js"></script>
		<link rel="import" href="/templates/ingameUi/ingameUi.html"/>
		<link rel="import" href="/templates/ingameUiHeader/ingameUiHeader.html"/>
		<link rel="import" href="/templates/NewPushButton/NewPushButton.html"/>
		<script type="text/javascript" src="preview.js"></script>
	</head>
	<body class="border-box">
		<ingamepanel-custom>
			<ingame-ui id="CockpitRadio" panel-id="COCKPIT_RADIO" title="驾驶舱电台 COCKPIT RADIO" content-fit="false" min-width="48.7" min-height="30">
				<div id="crMain">
					<div id="crTabs">
						<div id="tabFM" class="cr-tab">FM 电台</div>
						<div id="tabATC" class="cr-tab">ATC 频率</div>
					</div>
					<div id="crRegions"></div>
					<div id="crList"></div>
					<div id="crStatus">
						<span id="crNowPlaying" class="cr-np-text">未播放</span>
						<span id="crConn" class="cr-conn-text" style="color:#7fdd7f">服务已连接</span>
						<span class="cr-vol-wrap">
							<span class="cr-vol-label">音量</span>
							<input type="range" id="crVolume" min="0" max="100" value="80"/>
						</span>
						<new-push-button id="btnStop" class="cr-stop" title="停止"/>
					</div>
				</div>
			</ingame-ui>
		</ingamepanel-custom>
	</body>
</html>
